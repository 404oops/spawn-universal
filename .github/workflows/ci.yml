name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The protocol crate is pure Rust with no system dependencies, so it is
  # checked everywhere and is where the meaningful tests live.
  protocol:
    name: protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p spawn-protocol -- -D warnings
      - run: cargo test -p spawn-protocol --verbose

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: packaging/linux-build-deps.sh

      - name: Build
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --workspace

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: spawn-universal-${{ runner.os }}
          path: |
            target/release/spawn-universal
            target/release/spawn-universal.exe
          if-no-files-found: ignore
